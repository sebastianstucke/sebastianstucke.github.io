<style>
@font-face {
  font-family: "Lato";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("fonts/lato-400.woff2") format("woff2");
}
@font-face {
  font-family: "Lato";
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url("fonts/lato-700.woff2") format("woff2");
}
:root {
  --gap: 42px;
  --bg: #fafafa;
  --fg: #1a1d23;
  --muted: #69707d;
  --border: #e4e6ea;
  --hover: #efeff1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318;
    --fg: #f2f3f5;
    --muted: #9aa1ad;
    --border: #2a2e37;
    --hover: #1d2027;
  }
}
* { margin: 0; box-sizing: border-box; }
html, body { overflow: hidden; height: 100%; }
body {
  min-height: 100%;
  display: grid;
  justify-items: center;
  align-content: start;
  align-items: start;
  background: var(--bg);
  color: var(--fg);
  font: 24px/1.5 "Lato", sans-serif;
  text-align: center;
  padding: 24px;
}
main {
  margin-top: 12vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 500px;
}
@media (max-width: 600px) {
  :root { --gap: 20px; }
  body { padding: 16px; }
  main { margin-top: 4vh; }
  img { width: 140px; }
  h1 { font-size: 1.5rem; }
  p { font-size: 1rem; }
  nav { flex-wrap: wrap; justify-content: center; gap: 12px; }
  nav a { width: 210px; justify-content: center; padding: 10px 18px; font-size: 1rem; }
}
@media (max-height: 500px) {
  :root { --gap: 14px; }
  body { padding: 12px; }
  main { margin-top: 2vh; }
  img { width: 100px; }
  h1 { font-size: 1.3rem; }
  p { font-size: 0.95rem; }
  nav { flex-wrap: wrap; justify-content: center; gap: 10px; }
  nav a { width: 190px; justify-content: center; padding: 8px 14px; font-size: 0.95rem; }
}
img {
  width: 225px;
  height: auto;
  aspect-ratio: 1;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--border);
  box-shadow: 0 12px 36px rgba(0, 0, 0, .12);
}
h1 {
  margin-top: calc(var(--gap) - 12px);
  font-size: 2.05rem;
  font-weight: 700;
  letter-spacing: -.02em;
}
p {
  margin-top: 9px;
  color: var(--muted);
  font-size: 1.25rem;
}
nav {
  margin-top: var(--gap);
  display: flex;
  gap: 18px;
}
a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 27px;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--fg);
  text-decoration: none;
  font-size: 1.2rem;
  font-weight: 400;
  transition: background .15s;
}
a:hover { background: var(--hover); }
svg { width: 25px; height: 25px; fill: currentColor; }
</style>
